name: Update Metrics

on:
  schedule:
    - cron: '0 0 * * 0' # Runs every week on Sunday at midnight
  workflow_dispatch: # Allows manual trigger

jobs:
  update-metrics:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout repository
      uses: actions/checkout@v4
      with:
        token: ${{ secrets.PAT_TOKEN }}

    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: 3.x

    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install -r requirements.txt

    # Runs before the updater touches README.md: these guard against the
    # separator bug that silently merged entries on every run.
    - name: Run tests
      run: python tests/test_update_metrics.py

    - name: Run update_metrics.py
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      run: python update_metrics.py

    - name: Configure Git
      run: |
        git config --global user.name 'github-actions[bot]'
        git config --global user.email 'github-actions[bot]@users.noreply.github.com'

    # A week where no metric moved is a normal outcome, not a failure, so
    # only commit when something actually changed.
    - name: Commit changes
      run: |
        git add README.md
        if git diff --staged --quiet; then
          echo 'No metric changes this run; nothing to commit.'
        else
          git commit -m 'Update metrics in README.md'
          git push
        fi
      env:
        GITHUB_TOKEN: ${{ secrets.PAT_TOKEN }}
